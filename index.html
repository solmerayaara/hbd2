<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Happy Birthday, My Chelloo ❤️</title>
<style>
  :root{
    --midnight:#0b0a1f;
    --deep-purple:#1a0f2e;
    --purple:#3b1f5c;
    --rose:#e0578f;
    --pink:#f7a8c4;
    --gold:#f0c987;
    --warm-white:#fff6ec;
    --red:#c23b5a;
    --glass: rgba(255,255,255,0.06);
    --glass-border: rgba(255,255,255,0.14);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{
    margin:0; padding:0; width:100%; overflow-x:hidden;
    background: var(--midnight);
    color: var(--warm-white);
    font-family: 'Georgia', 'Iowan Old Style', serif;
    scroll-behavior:smooth;
  }
  @font-face{
    font-family:'Playfair';
    src: local('Georgia');
  }
  h1,h2,h3,.display{
    font-family: 'Playfair Display', 'Georgia', serif;
    font-weight:600;
    letter-spacing: 0.01em;
  }
  .sans{ font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

  #root{ position:relative; width:100%; }

  /* ---------- Background layers ---------- */
  .bg-fixed{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(ellipse 80% 50% at 50% -10%, rgba(224,87,143,0.18), transparent 60%),
      radial-gradient(ellipse 60% 40% at 80% 100%, rgba(59,31,92,0.35), transparent 60%),
      linear-gradient(180deg, #0b0a1f 0%, #150c2b 35%, #1a0f2e 65%, #200f36 100%);
    transition: background 1.5s ease;
  }
  .stars{
    position:fixed; inset:0; z-index:1; pointer-events:none; opacity:0.9;
  }
  .star{
    position:absolute; border-radius:50%; background:#fff;
    animation: twinkle 3.5s ease-in-out infinite;
  }
  @keyframes twinkle{
    0%,100%{ opacity:0.15; transform:scale(0.8);}
    50%{ opacity:1; transform:scale(1.15);}
  }
  .floaties{ position:fixed; inset:0; z-index:1; pointer-events:none; overflow:hidden;}
  .floaty{
    position:absolute; bottom:-40px; opacity:0;
    animation: floatUp linear infinite;
    filter: drop-shadow(0 0 6px rgba(224,87,143,0.5));
  }
  @keyframes floatUp{
    0%{ transform: translateY(0) translateX(0) rotate(0deg); opacity:0;}
    10%{ opacity:0.85;}
    90%{ opacity:0.6;}
    100%{ transform: translateY(-110vh) translateX(var(--drift,20px)) rotate(20deg); opacity:0;}
  }

  section{
    position:relative; z-index:2;
    min-height:100vh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding: 80px 20px;
    text-align:center;
  }

  .maxw{ max-width: 620px; width:100%; margin:0 auto; }
  @media(min-width:900px){ .maxw{ max-width: 760px; } }

  .eyebrow{
    font-family:-apple-system,sans-serif; font-size:12px; letter-spacing:0.25em;
    text-transform:uppercase; color: var(--pink); opacity:0.75; margin-bottom:18px;
    font-weight:600;
  }
  .glow-text{
    text-shadow: 0 0 30px rgba(224,87,143,0.35), 0 0 60px rgba(224,87,143,0.15);
  }
  .gradient-text{
    background: linear-gradient(90deg, var(--gold), var(--pink), var(--rose));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }

  /* buttons */
  .btn{
    font-family: -apple-system, sans-serif;
    display:inline-flex; align-items:center; gap:10px;
    padding: 16px 34px; border-radius: 999px; border: 1px solid var(--glass-border);
    background: linear-gradient(135deg, rgba(224,87,143,0.25), rgba(240,201,135,0.18));
    color: var(--warm-white); font-size:16px; font-weight:600; letter-spacing:0.02em;
    cursor:pointer; backdrop-filter: blur(10px);
    box-shadow: 0 0 25px rgba(224,87,143,0.25), inset 0 0 20px rgba(255,255,255,0.03);
    transition: transform .25s ease, box-shadow .25s ease, background .3s ease;
    -webkit-user-select:none; user-select:none;
  }
  .btn:hover, .btn:focus-visible{
    transform: translateY(-2px) scale(1.03);
    box-shadow: 0 0 40px rgba(224,87,143,0.45), inset 0 0 20px rgba(255,255,255,0.06);
  }
  .btn:active{ transform: scale(0.97); }
  .btn:focus-visible{ outline: 2px solid var(--pink); outline-offset: 3px; }

  /* glass card */
  .card{
    background: var(--glass);
    border: 1px solid var(--glass-border);
    border-radius: 22px;
    backdrop-filter: blur(14px);
    padding: 34px 28px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.35);
  }

  /* reveal-on-scroll */
  .reveal{
    opacity:0; transform: translateY(28px);
    transition: opacity 1s cubic-bezier(.2,.8,.2,1), transform 1s cubic-bezier(.2,.8,.2,1);
  }
  .reveal.in{ opacity:1; transform:none; }
  .reveal.d1{ transition-delay:.12s;}
  .reveal.d2{ transition-delay:.28s;}
  .reveal.d3{ transition-delay:.44s;}
  .reveal.d4{ transition-delay:.6s;}

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.2s !important; }
  }

  /* ---------- Progress nav ---------- */
  .progress-nav{
    position:fixed; right:22px; top:50%; transform:translateY(-50%);
    z-index:50; display:flex; flex-direction:column; gap:14px;
  }
  .progress-dot{
    width:9px; height:9px; border-radius:50%;
    background: rgba(255,255,255,0.25); border:1px solid rgba(255,255,255,0.3);
    cursor:pointer; transition: all .3s ease; position:relative;
  }
  .progress-dot.active{ background: var(--pink); box-shadow: 0 0 12px var(--pink); transform:scale(1.4); }
  @media(max-width:820px){ .progress-nav{ display:none; } }

  .mobile-nav-btn{
    position:fixed; bottom:20px; right:20px; z-index:60;
    width:52px; height:52px; border-radius:50%;
    background: linear-gradient(135deg, var(--rose), var(--purple));
    border:1px solid var(--glass-border);
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-size:20px; cursor:pointer;
    box-shadow: 0 4px 20px rgba(224,87,143,0.5);
  }
  @media(min-width:820px){ .mobile-nav-btn{ display:none; } }
  .mobile-nav-sheet{
    position:fixed; inset:0; z-index:70; background: rgba(11,10,31,0.92);
    backdrop-filter: blur(10px);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px;
    opacity:0; pointer-events:none; transition: opacity .3s ease;
  }
  .mobile-nav-sheet.open{ opacity:1; pointer-events:all; }
  .mobile-nav-sheet button{
    background:none; border:none; color: var(--warm-white); font-family:'Playfair Display',serif;
    font-size:22px; cursor:pointer; padding:8px 16px; opacity:0.75;
  }
  .mobile-nav-sheet button.active{ opacity:1; color: var(--pink); }
  .mobile-nav-close{
    position:absolute; top:24px; right:24px; font-size:28px; color:#fff; background:none; border:none; cursor:pointer;
  }

  /* ---------- Loading ---------- */
  #loader{
    position:fixed; inset:0; z-index:200; background: var(--midnight);
    display:flex; align-items:center; justify-content:center; flex-direction:column; gap:22px;
    transition: opacity .8s ease, visibility .8s ease;
  }
  #loader.hidden{ opacity:0; visibility:hidden; pointer-events:none; }
  .loader-heart{
    width:44px; height:44px; position:relative; animation: pulse 1.4s ease-in-out infinite;
  }
  .loader-heart svg{ width:100%; height:100%; filter: drop-shadow(0 0 14px rgba(224,87,143,0.7)); }
  @keyframes pulse{ 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.15);} }
  .loader-text{ font-family:-apple-system,sans-serif; font-size:14px; letter-spacing:0.15em; color: var(--pink); opacity:0.85;}

  /* ---------- Intro / Open Surprise ---------- */
  #intro{ min-height:100vh; }
  .intro-line{ font-size: clamp(18px, 4vw, 26px); color: var(--warm-white); opacity:0.9; margin:0 0 40px; font-style:italic; }

  /* ---------- Hero ---------- */
  .hero-title{
    font-size: clamp(34px, 8vw, 64px); line-height:1.15; margin: 0 0 18px;
  }
  .hero-sub{ font-size: clamp(15px, 3vw, 19px); color: var(--pink); opacity:0.85; margin-bottom:36px; font-style:italic;}
  .hero-photo-wrap{
    width: min(320px, 78vw); aspect-ratio: 4/5; border-radius: 20px; overflow:hidden;
    margin: 10px auto 36px; position:relative;
    border: 1px solid var(--glass-border);
    box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 40px rgba(224,87,143,0.2);
  }
  .hero-photo-wrap img{ width:100%; height:100%; object-fit:cover; display:block; }
  .photo-fallback{
    width:100%; height:100%; display:flex; align-items:center; justify-content:center;
    background: linear-gradient(135deg, var(--purple), var(--deep-purple));
    color: var(--pink); font-size:13px; letter-spacing:0.1em; text-align:center; padding:20px;
    font-family:-apple-system,sans-serif;
  }

  /* ---------- Cake section ---------- */
  .cake-wrap{ position:relative; width: 220px; height:220px; margin: 0 auto 30px; cursor:pointer; }
  .candle{ position:absolute; bottom:128px; width:6px; height:38px; background: linear-gradient(180deg,#fdf1de,#e9c98a); border-radius:3px; }
  .flame{
    position:absolute; top:-16px; left:50%; transform:translateX(-50%);
    width:10px; height:16px; border-radius:50% 50% 50% 50%/60% 60% 40% 40%;
    background: radial-gradient(circle at 50% 70%, #fff6c9, var(--gold) 60%, var(--red) 100%);
    box-shadow: 0 0 12px 4px rgba(240,201,135,0.7);
    animation: flicker 1.1s ease-in-out infinite;
    transform-origin: bottom center;
  }
  @keyframes flicker{
    0%,100%{ transform: translateX(-50%) scale(1) rotate(-2deg);}
    50%{ transform: translateX(-50%) scale(1.12) rotate(3deg);}
  }
  .flame.out{ opacity:0; transition: opacity .4s ease; }
  .smoke{
    position:absolute; top:-20px; left:50%; width:3px; height:0; background: rgba(255,255,255,0.4);
    border-radius:2px; opacity:0;
  }
  .smoke.show{ animation: smokeRise 1.4s ease-out forwards; }
  @keyframes smokeRise{
    0%{ height:0; opacity:0.6; transform: translate(-50%,0);}
    100%{ height:50px; opacity:0; transform: translate(-30%,-50px);}
  }
  .cake-tier{ position:absolute; left:50%; transform:translateX(-50%); border-radius:10px; }
  .tier1{ bottom:0; width:200px; height:60px; background: linear-gradient(180deg,#f3d3e0,#e0578f); }
  .tier2{ bottom:52px; width:150px; height:50px; background: linear-gradient(180deg,#fbe6ee,#f0a4c0); }
  .tier3{ bottom:96px; width:100px; height:36px; background: linear-gradient(180deg,#fff1f6,#f7c6da); }
  .drip{ position:absolute; bottom:52px; width:100%; height:14px; overflow:visible; }
  .cake-instruction{ font-size:15px; color: var(--pink); margin-top:14px; font-style:italic; }

  /* Confetti */
  .confetti-piece{
    position:fixed; top:-10px; z-index:150; pointer-events:none;
    animation: confettiFall linear forwards;
  }
  @keyframes confettiFall{
    to{ transform: translateY(105vh) rotate(540deg); opacity:0.3; }
  }

  /* ---------- Photo reveal ---------- */
  .photo-heart-btn{
    width:80px; height:80px; margin:0 auto 20px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    filter: drop-shadow(0 0 16px rgba(224,87,143,0.6));
    animation: pulse 2s ease-in-out infinite;
  }
  .photo-grid{ display:grid; grid-template-columns: 1fr; gap:22px; width:100%; margin-top:20px; }
  @media(min-width:640px){ .photo-grid.cols2{ grid-template-columns:1fr 1fr; } }
  .photo-item{ border-radius:18px; overflow:hidden; border:1px solid var(--glass-border); box-shadow:0 12px 30px rgba(0,0,0,0.4); }
  .photo-item img{ width:100%; height:auto; object-fit:contain; display:block; }
  .photo-caption{ font-size:13px; color:var(--pink); margin-top:10px; font-style:italic; font-family:-apple-system,sans-serif;}
  .memory-popup-backdrop{
    position:fixed; inset:0; z-index:120; background: rgba(11,10,31,0.86); backdrop-filter: blur(8px);
    display:flex; align-items:center; justify-content:center; padding:24px;
    opacity:0; pointer-events:none; transition: opacity .3s ease;
  }
  .memory-popup-backdrop.open{ opacity:1; pointer-events:all; }
  .memory-popup{
    width:min(420px, 100%); background: linear-gradient(160deg, rgba(59,31,92,0.7), rgba(11,10,31,0.95));
    border:1px solid var(--glass-border); border-radius:22px; padding: 32px 26px; text-align:center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.45);
    transform: translateY(10px) scale(0.97); transition: transform .3s ease;
  }
  .memory-popup-backdrop.open .memory-popup{ transform: translateY(0) scale(1); }
  .memory-popup-title{ margin: 0 0 12px; font-size: 18px; }
  .memory-popup-desc{ margin: 0; line-height: 1.8; opacity: 0.92; }

  /* ---------- Reasons carousel ---------- */
  .reasons-track{ display:flex; gap:16px; overflow-x:auto; scroll-snap-type:x mandatory; padding: 10px 4px 20px; width:100%; -webkit-overflow-scrolling:touch;}
  .reasons-track::-webkit-scrollbar{ height:4px; }
  .reasons-track::-webkit-scrollbar-thumb{ background: var(--rose); border-radius:4px; }
  .reason-card{
    scroll-snap-align:center; min-width: 78%; max-width:320px;
    background: var(--glass); border:1px solid var(--glass-border); border-radius:20px;
    padding: 30px 24px; backdrop-filter: blur(12px); flex-shrink:0;
    display:flex; flex-direction:column; align-items:center; gap:14px;
    transition: transform .3s ease;
  }
  @media(min-width:640px){ .reason-card{ min-width:260px; } }
  .reason-heart{ width:34px; height:34px; }
  .reason-text{ font-size:16px; line-height:1.5; }

  /* ---------- Letter ---------- */
  .letter-card{
    background: linear-gradient(160deg, rgba(255,246,236,0.06), rgba(224,87,143,0.05));
    border:1px solid var(--glass-border); border-radius:16px;
    padding: 40px 26px; text-align:left; position:relative;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }
  .letter-card::before{
    content:''; position:absolute; inset:10px; border:1px solid rgba(240,201,135,0.25); border-radius:10px; pointer-events:none;
  }
  .letter-para{
    font-size: 16px; line-height:1.9; margin:0 0 20px; color: var(--warm-white); opacity:0;
    transform: translateY(10px); transition: opacity .9s ease, transform .9s ease;
  }
  .letter-para.in{ opacity:1; transform:none; }
  .letter-sign{ text-align:right; font-style:italic; color: var(--pink); margin-top:10px; }

  /* ---------- Universe ---------- */
  #universe{ background: radial-gradient(circle at 50% 40%, rgba(59,31,92,0.5), transparent 70%); }
  .moon{
    width:90px; height:90px; border-radius:50%; margin:0 auto 30px;
    background: radial-gradient(circle at 35% 35%, #fff9ec, var(--gold) 70%);
    box-shadow: 0 0 60px 20px rgba(240,201,135,0.35);
  }
  .universe-line{ font-size: clamp(20px,4.5vw,30px); margin: 8px 0; opacity:0; transform: translateY(14px); transition: all 1s ease; }
  .universe-line.in{ opacity:1; transform:none; }

  /* ---------- Timeline ---------- */
  .timeline{ position:relative; width:100%; padding-left: 30px; text-align:left; }
  .timeline::before{ content:''; position:absolute; left:8px; top:6px; bottom:6px; width:2px; background: linear-gradient(180deg, var(--rose), var(--purple)); }
  .tl-item{ position:relative; margin-bottom:44px; }
  .tl-dot{ position:absolute; left:-30px; top:4px; width:14px; height:14px; border-radius:50%; background: var(--rose); box-shadow: 0 0 12px var(--rose); }
  .tl-date{ font-size:12px; letter-spacing:0.1em; color: var(--gold); font-family:-apple-system,sans-serif; margin-bottom:6px; text-transform:uppercase;}
  .tl-title{ font-size:19px; margin: 0 0 8px; }
  .tl-desc{ font-size:15px; opacity:0.85; line-height:1.6; margin:0 0 12px; }
  .tl-img{ width:100%; max-width:340px; border-radius:14px; overflow:hidden; border:1px solid var(--glass-border); }
  .tl-img img{ width:100%; display:block; height:auto; object-fit:contain; }

  /* ---------- Secret ---------- */
  .secret-heart-wrap{ width:110px; height:110px; margin:0 auto 24px; position:relative; cursor:pointer; }
  .secret-heart-wrap svg{ width:100%; height:100%; filter: drop-shadow(0 0 20px rgba(224,87,143,0.5)); transition: filter .3s ease; }
  .secret-progress{ font-size:13px; color:var(--pink); margin-top:14px; font-family:-apple-system,sans-serif; letter-spacing:0.05em;}
  .secret-reveal{ margin-top:26px; }

  /* ---------- Envelopes ---------- */
  .env-grid{ display:grid; grid-template-columns:1fr; gap:16px; width:100%; }
  @media(min-width:640px){ .env-grid{ grid-template-columns:1fr 1fr; } }
  .envelope{
    background: var(--glass); border:1px solid var(--glass-border); border-radius:16px;
    padding: 22px 20px; cursor:pointer; text-align:left; transition: transform .25s ease, background .25s ease;
    display:flex; align-items:center; gap:14px;
  }
  .envelope:hover{ transform: translateY(-3px); background: rgba(255,255,255,0.1); }
  .envelope-icon{ font-size:26px; flex-shrink:0; }
  .envelope-label{ font-size:15px; font-family:-apple-system,sans-serif; }
  .envelope-modal-backdrop{
    position:fixed; inset:0; z-index:100; background: rgba(11,10,31,0.85); backdrop-filter: blur(8px);
    display:flex; align-items:center; justify-content:center; padding:24px;
    opacity:0; pointer-events:none; transition: opacity .3s ease;
  }
  .envelope-modal-backdrop.open{ opacity:1; pointer-events:all; }
  .envelope-modal{
    max-width:420px; width:100%; background: linear-gradient(160deg, rgba(59,31,92,0.6), rgba(11,10,31,0.9));
    border:1px solid var(--glass-border); border-radius:20px; padding: 36px 28px; text-align:center;
    transform: scale(0.9); transition: transform .3s ease;
  }
  .envelope-modal-backdrop.open .envelope-modal{ transform:scale(1); }
  .envelope-modal-close{ margin-top:22px; background:none; border:1px solid var(--glass-border); color:var(--warm-white); padding:10px 22px; border-radius:999px; cursor:pointer; font-family:-apple-system,sans-serif;}

  /* ---------- Music / voice ---------- */
  .player-card{ display:flex; align-items:center; gap:16px; width:100%; }
  .vinyl{
    width:56px; height:56px; border-radius:50%; background: radial-gradient(circle, #111 0 18%, #333 19% 22%, #111 23% 100%);
    flex-shrink:0; animation: spin 3s linear infinite; animation-play-state: paused;
    border: 2px solid rgba(255,255,255,0.15);
  }
  .vinyl.playing{ animation-play-state: running; }
  @keyframes spin{ to{ transform: rotate(360deg); } }
  .play-btn{
    width:44px; height:44px; border-radius:50%; border:none; cursor:pointer;
    background: linear-gradient(135deg, var(--rose), var(--purple)); color:#fff; font-size:16px;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .eq{ display:flex; align-items:flex-end; gap:3px; height:18px; }
  .eq span{ width:3px; background: var(--pink); border-radius:2px; animation: eqBounce 1s ease-in-out infinite; }
  .eq span:nth-child(2){ animation-delay:.2s;} .eq span:nth-child(3){ animation-delay:.4s;}
  @keyframes eqBounce{ 0%,100%{ height:4px;} 50%{ height:16px;} }
  input[type=range]{ width:100%; accent-color: var(--rose); }
  .waveform{ display:flex; align-items:center; gap:2px; height:32px; flex:1; overflow:hidden; }
  .wave-bar{ width:3px; background: rgba(240,168,196,0.4); border-radius:2px; flex-shrink:0; }
  .wave-bar.played{ background: var(--pink); }

  /* ---------- Countdown ---------- */
  .countdown-grid{ display:flex; gap:14px; justify-content:center; flex-wrap:wrap; margin: 20px 0; }
  .cd-box{ background: var(--glass); border:1px solid var(--glass-border); border-radius:14px; padding: 16px 14px; min-width:74px; }
  .cd-num{ font-size: 30px; font-weight:700; font-family:'Playfair Display',serif; color: var(--gold); }
  .cd-label{ font-size:11px; letter-spacing:0.1em; text-transform:uppercase; opacity:0.7; font-family:-apple-system,sans-serif; }

  /* ---------- Final scene ---------- */
  #final{ background: linear-gradient(180deg, #0b0a1f, #150c2b 40%, #24102f); }
  .final-line{ font-size: clamp(22px, 5vw, 36px); margin:14px 0; opacity:0; transform: translateY(16px); transition: all 1.1s ease; }
  .final-line.in{ opacity:1; transform:none; }
  .final-sign{ margin-top:30px; font-style:italic; color: var(--pink); font-size:18px; opacity:0; transition: opacity 1.2s ease 0.3s; }
  .final-sign.in{ opacity:1; }

  .footer-space{ height: 10vh; }

  ::selection{ background: var(--rose); color:#fff; }
</style>
</head>

<div id="loader">
  <div class="loader-heart">
    <svg viewBox="0 0 32 29" fill="none"><path d="M16 28C16 28 1 18.5 1 8.9C1 3.9 4.9 1 8.9 1C12 1 14.5 2.8 16 5.4C17.5 2.8 20 1 23.1 1C27.1 1 31 3.9 31 8.9C31 18.5 16 28 16 28Z" fill="#e0578f"/></svg>
  </div>
  <div class="loader-text">PREPARING SOMETHING SPECIAL FOR YOU ✨</div>
</div>

<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useCallback } = React;

/* ============================================================
   PERSONALIZATION DATA — edit everything here
   ============================================================ */
const birthdayData = {

  ],

/* ============================================================
   Small utility hooks/components
   ============================================================ */

function useInView(threshold = 0.25) {
  const ref = useRef(null);
  const [inView, setInView] = useState(false);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const obs = new IntersectionObserver(
      (entries) => entries.forEach((e) => { if (e.isIntersecting) setInView(true); }),
      { threshold }
    );
    obs.observe(el);
    return () => obs.disconnect();
  }, []);
  return [ref, inView];
}

function Reveal({ children, delay = 0, className = "" }) {
  const [ref, inView] = useInView(0.2);
  const d = delay === 0 ? "" : delay === 1 ? "d1" : delay === 2 ? "d2" : delay === 3 ? "d3" : "d4";
  return <div ref={ref} className={`reveal ${d} ${inView ? "in" : ""} ${className}`}>{children}</div>;
}

function SafeImage({ src, alt, className, style }) {
  const [failed, setFailed] = useState(false);
  if (failed) {
    return (
      <div className="photo-fallback" style={style}>
        <span>✨ {alt || "A memory to hold onto"} ✨</span>
      </div>
    );
  }
  return <img src={src} alt={alt} className={className} style={style} onError={() => setFailed(true)} loading="lazy" />;
}

function HeartIcon({ size = 32, fill = "#e0578f" }) {
  return (
    <svg width={size} height={size} viewBox="0 0 32 29" fill="none">
      <path d="M16 28C16 28 1 18.5 1 8.9C1 3.9 4.9 1 8.9 1C12 1 14.5 2.8 16 5.4C17.5 2.8 20 1 23.1 1C27.1 1 31 3.9 31 8.9C31 18.5 16 28 16 28Z" fill={fill} />
    </svg>
  );
}

/* Floating hearts / particles background */
function Floaties() {
  const items = useRef(
    Array.from({ length: 14 }).map((_, i) => ({
      id: i,
      left: Math.random() * 100,
      delay: Math.random() * 14,
      duration: 12 + Math.random() * 10,
      size: 10 + Math.random() * 14,
      drift: (Math.random() - 0.5) * 120,
      kind: Math.random() > 0.6 ? "heart" : "dot",
    }))
  ).current;
  return (
    <div className="floaties" aria-hidden="true">
      {items.map((it) => (
        <div
          key={it.id}
          className="floaty"
          style={{
            left: `${it.left}%`,
            animationDelay: `${it.delay}s`,
            animationDuration: `${it.duration}s`,
            "--drift": `${it.drift}px`,
          }}
        >
          {it.kind === "heart" ? (
            <HeartIcon size={it.size} fill="rgba(224,87,143,0.55)" />
          ) : (
            <div style={{ width: it.size / 2.5, height: it.size / 2.5, borderRadius: "50%", background: "rgba(240,201,135,0.6)" }} />
          )}
        </div>
      ))}
    </div>
  );
}

function Stars({ count = 90 }) {
  const stars = useRef(
    Array.from({ length: count }).map((_, i) => ({
      id: i,
      top: Math.random() * 100,
      left: Math.random() * 100,
      size: Math.random() * 2 + 1,
      delay: Math.random() * 4,
    }))
  ).current;
  return (
    <div className="stars" aria-hidden="true">
      {stars.map((s) => (
        <div
          key={s.id}
          className="star"
          style={{
            top: `${s.top}%`,
            left: `${s.left}%`,
            width: s.size,
            height: s.size,
            animationDelay: `${s.delay}s`,
          }}
        />
      ))}
    </div>
  );
}

function Confetti({ trigger }) {
  const [pieces, setPieces] = useState([]);
  useEffect(() => {
    if (!trigger) return;
    const colors = ["#e0578f", "#f0c987", "#f7a8c4", "#c23b5a", "#fff6ec"];
    const newPieces = Array.from({ length: 60 }).map((_, i) => ({
      id: `${trigger}-${i}`,
      left: Math.random() * 100,
      color: colors[Math.floor(Math.random() * colors.length)],
      duration: 2.5 + Math.random() * 2,
      delay: Math.random() * 0.4,
      size: 6 + Math.random() * 6,
    }));
    setPieces(newPieces);
    const t = setTimeout(() => setPieces([]), 5000);
    return () => clearTimeout(t);
  }, [trigger]);
  return (
    <>
      {pieces.map((p) => (
        <div
          key={p.id}
          className="confetti-piece"
          style={{
            left: `${p.left}%`,
            width: p.size,
            height: p.size * 0.4,
            background: p.color,
            animationDuration: `${p.duration}s`,
            animationDelay: `${p.delay}s`,
            borderRadius: "2px",
          }}
        />
      ))}
    </>
  );
}

/* ============================================================
   Section: Cake
   ============================================================ */
function BirthdayCake() {
  const [litCandles, setLitCandles] = useState([true, true, true]);
  const [smoking, setSmoking] = useState([false, false, false]);
  const [wishGranted, setWishGranted] = useState(false);
  const [confettiKey, setConfettiKey] = useState(0);

  const blowCandle = (i) => {
    if (!litCandles[i]) return;
    setLitCandles((prev) => { const n = [...prev]; n[i] = false; return n; });
    setSmoking((prev) => { const n = [...prev]; n[i] = true; return n; });
    setTimeout(() => {
      setSmoking((prev) => { const n = [...prev]; n[i] = false; return n; });
    }, 1400);
  };

  useEffect(() => {
    if (litCandles.every((c) => !c) && !wishGranted) {
      setTimeout(() => {
        setWishGranted(true);
        setConfettiKey((k) => k + 1);
      }, 500);
    }
  }, [litCandles]);

  return (
    <section id="cake">
      <Confetti trigger={confettiKey} />
      <div className="maxw">
        <Reveal><div className="eyebrow">Make a wish</div></Reveal>
        <Reveal delay={1}><h2 className="display" style={{ fontSize: "clamp(24px,5vw,34px)", marginBottom: 30 }}>Blow out the candles 🕯️</h2></Reveal>
        <div className="cake-wrap" role="group" aria-label="Birthday cake with three candles">
          {[0, 1, 2].map((i) => (
            <div key={i} className="candle" style={{ left: `${86 + i * 24}px` }} onClick={() => blowCandle(i)} role="button" tabIndex={0}
              aria-label={`Candle ${i + 1}, ${litCandles[i] ? "lit, tap to blow out" : "blown out"}`}
              onKeyDown={(e) => { if (e.key === "Enter") blowCandle(i); }}
            >
              <div className={`flame ${litCandles[i] ? "" : "out"}`}></div>
              <div className={`smoke ${smoking[i] ? "show" : ""}`}></div>
            </div>
          ))}
          <div className="cake-tier tier1"></div>
          <div className="cake-tier tier2"></div>
          <div className="cake-tier tier3"></div>
        </div>
        <p className="cake-instruction">{wishGranted ? "" : "Tap each candle to blow it out"}</p>
        {wishGranted && (
          <Reveal>
            <h3 className="display gradient-text" style={{ fontSize: "clamp(22px,5vw,30px)", marginTop: 10 }}>
              Wish granted. ❤️
            </h3>
          </Reveal>
        )}
      </div>
    </section>
  );
}

/* ============================================================
   Section: Photo Reveal
   ============================================================ */
function PhotoReveal({ onComplete }) {
  const [revealed, setRevealed] = useState(false);
  const [count, setCount] = useState(0);
  const [currentIndex, setCurrentIndex] = useState(-1);
  const completedRef = useRef(false);
  const [popupIndex, setPopupIndex] = useState(null);
  const photos = birthdayData.memories.map((m) => m.image);
  const labels = ["One memory...", "Another memory...", "And another...", "So many to hold onto...", "And countless more to come."];

  const revealNext = () => {
    if (popupIndex !== null) return;
    if (count >= photos.length) return;
    setPopupIndex(count);
  };

  const closePopup = () => {
    if (popupIndex === null) return;
    setRevealed(true);
    setCurrentIndex(popupIndex);
    setCount((current) => Math.max(current, popupIndex + 1));
    setPopupIndex(null);
  };

  useEffect(() => {
    if (!revealed || count < photos.length || completedRef.current) return;
    completedRef.current = true;
    if (typeof onComplete === "function") {
      const timer = setTimeout(() => onComplete(), 650);
      return () => clearTimeout(timer);
    }
  }, [revealed, count, photos.length, onComplete]);

  return (
    <section id="photos">
      <div className="maxw">
        <Reveal><div className="eyebrow">Every beautiful story has memories</div></Reveal>
        {!revealed ? (
          <Reveal delay={1}>
            <div className="photo-heart-btn" onClick={revealNext} role="button" tabIndex={0} aria-label="Reveal memories" onKeyDown={(e) => { if (e.key === "Enter") revealNext(); }}>
              <HeartIcon size={64} />
            </div>
            <p className="sans" style={{ opacity: 0.7, fontSize: 14 }}>Tap the heart</p>
          </Reveal>
        ) : (
          <>
            <p className="photo-caption" style={{ fontSize: 16, marginBottom: 20 }}>{labels[Math.min(count - 1, labels.length - 1)]}</p>
            <div className="photo-item" style={{ width: "100%", maxWidth: 460, margin: "0 auto" }}>
              <SafeImage src={photos[Math.max(0, currentIndex)]} alt={birthdayData.memories[Math.max(0, currentIndex)]?.title || `Memory ${currentIndex + 1}`} />
              <div className="photo-message">
                <p className="photo-message-title display">{birthdayData.memories[Math.max(0, currentIndex)]?.title}</p>
                <p className="photo-message-text">{birthdayData.memories[Math.max(0, currentIndex)]?.description}</p>
              </div>
            </div>
            {count < photos.length && (
              <button className="btn" style={{ marginTop: 30, padding: "12px 26px", fontSize: 14 }} onClick={revealNext}>
                Reveal another memory
              </button>
            )}
          </>
        )}
      </div>
      <div className={`memory-popup-backdrop ${popupIndex !== null ? "open" : ""}`} role="dialog" aria-modal="true" aria-labelledby="memory-popup-title" onClick={closePopup}>
        {popupIndex !== null && (
          <div className="memory-popup" onClick={(e) => e.stopPropagation()}>
            <h3 className="display memory-popup-title" id="memory-popup-title">{birthdayData.memories[popupIndex]?.title || `Memory ${popupIndex + 1}`}</h3>
            <p className="sans memory-popup-desc">{birthdayData.memories[popupIndex]?.description || "A memory worth holding onto for a little longer."}</p>
            <button className="btn" style={{ marginTop: 24, padding: "12px 26px", fontSize: 14 }} onClick={closePopup}>Show photo</button>
          </div>
        )}
      </div>
    </section>
  );
}

function SecretMessage() {
  const [taps, setTaps] = useState(0);
  const [unlocked, setUnlocked] = useState(false);

  const handleTap = () => {
    if (unlocked) return;
    const n = taps + 1;
    setTaps(n);
    if (n >= needed) setUnlocked(true);
  };

  return (
    <section id="secret">
      <div className="maxw">
        <Reveal><div className="eyebrow">There is one more thing...</div></Reveal>
        {!unlocked ? (
          <>
            <div
              className="secret-heart-wrap"
              onClick={handleTap}
              role="button"
              tabIndex={0}
              aria-label={`Locked heart, tapped ${taps} of ${needed} times`}
              onKeyDown={(e) => { if (e.key === "Enter") handleTap(); }}
            >
              <HeartIcon size={110} fill={taps > 0 ? "#f0578f" : "#7f5c8f"} />
            </div>
            <button className="btn" onClick={handleTap} style={{ padding: "12px 28px", fontSize: 14 }}>Unlock ❤️ ({taps}/{needed})</button>
          </>
        ) : (
          <div className="secret-reveal">
            {birthdayData.secretMessage.map((line, i) => (

                <p className="display glow-text" style={{ fontSize: "clamp(19px,4vw,26px)", margin: "10px 0" }}>{line}</p>
              </Reveal>
            ))}
          </div>
        )}
      </div>
    </section>
  );
}

      <div className={`envelope-modal-backdrop ${openIdx !== null ? "open" : ""}`} role="dialog" aria-modal="true" onClick={() => setOpenIdx(null)}>
        <div className="envelope-modal" onClick={(e) => e.stopPropagation()}>
          {openIdx !== null && (
            <>
              <div style={{ fontSize: 30, marginBottom: 14 }}>{birthdayData.openWhen[openIdx].icon}</div>
              <p className="display" style={{ fontSize: 18, lineHeight: 1.7 }}>{birthdayData.openWhen[openIdx].message}</p>
            </>
          )}
          <button className="envelope-modal-close" onClick={() => setOpenIdx(null)}>Close</button>
        </div>
      </div>
    </section>
  );
}

/* ============================================================
   Section: Music Player
   ============================================================ */
function MusicPlayer() {
  const audioRef = useRef(null);
  const [playing, setPlaying] = useState(false);
  const [progress, setProgress] = useState(0);
  const [duration, setDuration] = useState(0);
  const [errored, setErrored] = useState(false);

  const toggle = () => {
    const a = audioRef.current;
    if (!a) return;
    if (playing) { a.pause(); setPlaying(false); }
    else { a.play().then(() => setPlaying(true)).catch(() => setErrored(true)); }
  };

  return (
    <section id="music">
      <div className="maxw">
        <Reveal><div className="eyebrow">Our song</div></Reveal>
        <Reveal delay={1}><h2 className="display" style={{ fontSize: "clamp(22px,5vw,30px)", marginBottom: 26 }}>🎵 Play our song</h2></Reveal>
        <Reveal delay={2}>
          <div className="card player-card">
            <div className={`vinyl ${playing ? "playing" : ""}`}></div>
            <div style={{ flex: 1, textAlign: "left" }}>
              <audio
                ref={audioRef}
                src={birthdayData.musicPath}
                onTimeUpdate={(e) => setProgress(e.target.currentTime)}
                onLoadedMetadata={(e) => setDuration(e.target.duration)}
                onEnded={() => setPlaying(false)}
                onError={() => setErrored(true)}
              />
              {errored ? (
                <p className="sans" style={{ fontSize: 13, opacity: 0.6, margin: 0 }}>Music space ready for {birthdayData.musicPath}</p>
              ) : (
                <>
                  <input
                    type="range"
                    min="0"
                    max={duration || 0}
                    value={progress}
                    onChange={(e) => { audioRef.current.currentTime = e.target.value; setProgress(Number(e.target.value)); }}
                    aria-label="Song progress"
                  />
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: 6 }}>
                    {playing && <div className="eq" aria-hidden="true"><span></span><span></span><span></span></div>}
                    <span style={{ marginLeft: "auto" }}></span>
                  </div>
                </>
              )}
            </div>
            <button className="play-btn" onClick={toggle} aria-label={playing ? "Pause" : "Play"} disabled={errored}>
              {playing ? "❚❚" : "▶"}
            </button>
          </div>
        </Reveal>
      </div>
    </section>
  );
}

/* ============================================================
   Section: Voice Message
   ============================================================ */
function VoiceMessage() {
  const audioRef = useRef(null);
  const [playing, setPlaying] = useState(false);
  const [progress, setProgress] = useState(0);
  const [duration, setDuration] = useState(0);
  const [errored, setErrored] = useState(false);
  const bars = useRef(Array.from({ length: 40 }).map(() => 6 + Math.random() * 26)).current;

  const toggle = () => {
    const a = audioRef.current;
    if (!a) return;
    if (playing) { a.pause(); setPlaying(false); }
    else { a.play().then(() => setPlaying(true)).catch(() => setErrored(true)); }
  };

  const playedRatio = duration ? progress / duration : 0;

  return (
    <section id="voice">
      <div className="maxw">
        <Reveal><div className="eyebrow">Some things are better heard</div></Reveal>
        <Reveal delay={1}><h2 className="display" style={{ fontSize: "clamp(22px,5vw,30px)", marginBottom: 26 }}>A voice message for you</h2></Reveal>
        <Reveal delay={2}>
          <div className="card">
            <audio
              ref={audioRef}
              src={birthdayData.voiceMessagePath}
              onTimeUpdate={(e) => setProgress(e.target.currentTime)}
              onLoadedMetadata={(e) => setDuration(e.target.duration)}
              onEnded={() => setPlaying(false)}
              onError={() => setErrored(true)}
            />
            {errored ? (
              <p className="sans" style={{ fontSize: 13, opacity: 0.6 }}>Voice message space ready for {birthdayData.voiceMessagePath}</p>
            ) : (
              <div style={{ display: "flex", alignItems: "center", gap: 14 }}>
                <button className="play-btn" onClick={toggle} aria-label={playing ? "Pause voice message" : "Play voice message"}>
                  {playing ? "❚❚" : "▶"}
                </button>
                <div className="waveform" aria-hidden="true">
                  {bars.map((h, i) => (
                    <div key={i} className={`wave-bar ${i / bars.length < playedRatio ? "played" : ""}`} style={{ height: h }}></div>
                  ))}
                </div>
              </div>
            )}
          </div>
        </Reveal>
      </div>
    </section>
  );
}

/* ============================================================
   Section: Countdown
   ============================================================ */
function useCountdown(targetDate) {
  const [remaining, setRemaining] = useState(() => targetDate.getTime() - Date.now());
  useEffect(() => {
    const t = setInterval(() => setRemaining(targetDate.getTime() - Date.now()), 1000);
    return () => clearInterval(t);
  }, [targetDate]);
  return remaining;
}

function Countdown() {
  const target = useRef(new Date(birthdayData.date + "T00:00:00")).current;
  const remaining = useCountdown(target);
  const isPast = remaining <= 0;

  if (isPast) {
    return (
      <section id="countdown">
        <div className="maxw">
          <Reveal>
            <h2 className="display gradient-text glow-text" style={{ fontSize: "clamp(26px,6vw,40px)" }}>
              Today is your day. ❤️
            </h2>
          </Reveal>
        </div>
      </section>
    );
  }

  const days = Math.floor(remaining / 86400000);
  const hours = Math.floor((remaining % 86400000) / 3600000);
  const minutes = Math.floor((remaining % 3600000) / 60000);
  const seconds = Math.floor((remaining % 60000) / 1000);

  return (
    <section id="countdown">
      <div className="maxw">
        <Reveal><div className="eyebrow">Almost there</div></Reveal>
        <Reveal delay={1}><h2 className="display" style={{ fontSize: "clamp(22px,5vw,30px)" }}>Counting down to your day</h2></Reveal>
        <div className="countdown-grid">
          {[["Days", days], ["Hours", hours], ["Minutes", minutes], ["Seconds", seconds]].map(([label, val]) => (
            <div className="cd-box" key={label}>
              <div className="cd-num">{String(val).padStart(2, "0")}</div>
              <div className="cd-label">{label}</div>
            </div>
          ))}
        </div>
      </div>
    </section>
  );
}

/* ============================================================
   Section: Final Scene
   ============================================================ */
function FinalScene() {
  const [ref, inView] = useInView(0.3);
  const [confettiKey, setConfettiKey] = useState(0);

  useEffect(() => {
    if (inView) {
      const t = setTimeout(() => setConfettiKey((k) => k + 1), 1800);
      return () => clearTimeout(t);
    }
  }, [inView]);

  return (
    <section id="final">
      <Confetti trigger={confettiKey} />
      <div className="maxw" ref={ref}>
        <div style={{ marginBottom: 24 }}>
          <HeartIcon size={40} />
        </div>
        {birthdayData.finalMessage.map((line, i) => (
          <p key={i} className={`final-line display gradient-text glow-text ${inView ? "in" : ""}`} style={{ transitionDelay: inView ? `${i * 0.5}s` : "0s" }}>
            {line}
          </p>
        ))}
        <p className={`final-sign ${inView ? "in" : ""}`} style={{ transitionDelay: inView ? "2.2s" : "0s" }}>
          {birthdayData.finalSign}
        </p>
      </div>
      <div className="footer-space"></div>
    </section>
  );
}

/* ============================================================
   App root
   ============================================================ */
function App() {
  const [begun, setBegun] = useState(false);
  const [activeIdx, setActiveIdx] = useState(0);
  const sectionRefs = useRef({});

  useEffect(() => {
    const loader = document.getElementById("loader");
    const t = setTimeout(() => loader && loader.classList.add("hidden"), 1400);
    return () => clearTimeout(t);
  }, []);

  useEffect(() => {
    if (!begun) return;
    const observer = new IntersectionObserver(
      (entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            const idx = SECTIONS.findIndex((s) => s.id === entry.target.id);
            if (idx !== -1) setActiveIdx(idx);
          }
        });
      },
      { threshold: 0.5 }
    );
    SECTIONS.forEach((s) => {
      const el = document.getElementById(s.id);
      if (el) observer.observe(el);
    });
    return () => observer.disconnect();
  }, [begun]);

  const navigate = (id) => {
    const el = document.getElementById(id);
    if (el) el.scrollIntoView({ behavior: "smooth" });
  };

  return (
    <>
      <div className="bg-fixed"></div>
      <Stars />
      {begun && <Floaties />}
      {begun && <ProgressNav active={activeIdx} onNavigate={navigate} />}
      {begun && <MobileNav active={activeIdx} onNavigate={navigate} />}

      <Intro onOpen={() => setBegun(true)} />
      {begun && (
        <>
        <Countdown />
          <Hero />
          <BirthdayCake />
          <PhotoReveal onComplete={() => navigate("reasons")} />
          <Reasons />
          <LoveLetter />
          <Universe />
          <Timeline />
          <SecretMessage />
          <OpenWhen />
          <MusicPlayer />
        
          <FinalScene />
        </>
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
